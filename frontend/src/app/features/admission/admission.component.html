<div class="container">
  <h2>Student Admission Form</h2>
  <p>Fill in your details below.</p>

  @if (successMessage) {
    <p class="success">{{ successMessage }}</p>
  }

  @if (errorMessage) {
    <p class="error">{{ errorMessage }}</p>
  }

  <form #form="ngForm" (ngSubmit)="submitAdmission()">
    <h3>Personal Details</h3>

    <div class="grid">
      <input
        type="text"
        name="firstName"
        placeholder="First Name"
        [(ngModel)]="admission.firstName"
        required
      />

      <input
        type="text"
        name="lastName"
        placeholder="Last Name"
        [(ngModel)]="admission.lastName"
        required
      />

      <input
        type="email"
        name="email"
        placeholder="Email"
        [(ngModel)]="admission.email"
        required
      />

      <input
        type="tel"
        name="phone"
        placeholder="Phone Number"
        [(ngModel)]="admission.phone"
        pattern="[0-9]{10}"
        maxlength="10"
        required
      />

      <input type="date" name="dob" [(ngModel)]="admission.dob" required />

      <select name="gender" [(ngModel)]="admission.gender" required>
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>

    <h3>Parent Details</h3>

    <div class="grid">
      <input
        type="text"
        name="fatherName"
        placeholder="Father Name"
        [(ngModel)]="admission.fatherName"
        required
      />

      <input
        type="text"
        name="motherName"
        placeholder="Mother Name"
        [(ngModel)]="admission.motherName"
        required
      />

      <input
        type="tel"
        name="guardianPhone"
        placeholder="Guardian Phone"
        [(ngModel)]="admission.guardianPhone"
        pattern="[0-9]{10}"
        maxlength="10"
      />
    </div>

    <h3>Course Details</h3>

    <div class="grid">
      <select name="course" [(ngModel)]="admission.course" required>
        <option value="">Select Course</option>
        @for (course of courses; track course) {
          <option [value]="course">{{ course }}</option>
        }
      </select>

      <input
        type="text"
        name="qualification"
        placeholder="Qualification"
        [(ngModel)]="admission.qualification"
        required
      />

      <input
        type="number"
        name="percentage"
        placeholder="Percentage"
        [(ngModel)]="admission.percentage"
        min="0"
        max="100"
        required
      />

      <input
        type="number"
        name="passingYear"
        placeholder="Passing Year"
        [(ngModel)]="admission.passingYear"
        min="1990"
        required
      />
    </div>

    <h3>Address Details</h3>

    <div class="grid">
      <textarea
        name="address"
        placeholder="Full Address"
        [(ngModel)]="admission.address"
        required
      ></textarea>

      <input
        type="text"
        name="city"
        placeholder="City"
        [(ngModel)]="admission.city"
        required
      />

      <input
        type="text"
        name="state"
        placeholder="State"
        [(ngModel)]="admission.state"
        required
      />

      <input
        type="text"
        name="pincode"
        placeholder="Pincode"
        [(ngModel)]="admission.pincode"
        pattern="[0-9]{6}"
        maxlength="6"
        required
      />
    </div>

    <div class="actions">
      <button type="submit" [disabled]="form.invalid || loading">
        {{ loading ? "Submitting..." : "Submit Admission" }}
      </button>

      <button type="button" class="reset" (click)="resetForm()">Reset</button>
    </div>
  </form>
</div>
